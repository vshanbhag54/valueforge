name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: valueforge-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m compileall -q app.py valueforge
      - run: python -m pytest -q
