name: ValueForge daily market refresh and research
on:
  push:
    branches: [main]
    paths:
      - "valueforge/research.py"
  schedule:
    # 21:15 IST weekdays, after TejHQ's usual EOD data publication window.
    - cron: "45 15 * * 1-5"
  workflow_dispatch:
    inputs:
      filing_lookback_days:
        description: "Filing discovery lookback in days (2555 queues roughly seven years)"
        required: false
        default: "2555"
        type: string
      filing_batch_limit:
        description: "Maximum XBRL filings to fetch and parse in this run"
        required: false
        default: "180"
        type: string
permissions:
  contents: write
concurrency:
  group: valueforge-daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash-lite
      VALUEFORGE_AI_DAILY_LIMIT: "2"
      VALUEFORGE_FILINGS_LOOKBACK_DAYS: ${{ inputs.filing_lookback_days || '45' }}
      VALUEFORGE_FILINGS_LIMIT: ${{ inputs.filing_batch_limit || '180' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover, download and normalize NSE/BSE XBRL financial filings
        continue-on-error: true
        run: |
          python -m valueforge.cli sync-filings \
            --lookback-days "$VALUEFORGE_FILINGS_LOOKBACK_DAYS" \
            --limit "$VALUEFORGE_FILINGS_LIMIT" \
            --workers 4
      - name: Refresh EOD universe and run fundamentals-backed research scan
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Market refresh and scan attempt $attempt/3"
            if python -m valueforge.cli refresh-and-scan; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "Market refresh/scan failed after three attempts."
          exit 1
      - name: Persist successful ingestion and research state (even if the scan fails)
        if: always()
        run: |
          if [ ! -d .git ]; then
            echo "Checkout unavailable; there is no repository state to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            data/live/market_status.json \
            data/live/research_status.json \
            data/live/filings_status.json \
            data/master/security_master.csv \
            data/master/security_master_status.json \
            data/fundamentals/xbrl_fundamentals.csv \
            data/fundamentals/processed_filings.csv \
            data/fundamentals/xbrl_filing_queue.jsonl \
            data/fundamentals/backfill_state.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -d data/live/reports ]; then git add data/live/reports; fi
          if git diff --cached --quiet; then
            echo "No status, filing or report changes."
          else
            git commit -m "chore(data): refresh market and XBRL research state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              echo "Persistence push attempt $attempt failed."
              git rebase --abort || true
              sleep $((attempt * 15))
            done
            echo "Could not persist updated research state after three attempts."
            exit 1
          fi
