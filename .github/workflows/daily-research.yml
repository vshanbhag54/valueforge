name: ValueForge daily market refresh and research
on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "valueforge/**"
      - ".github/workflows/daily-research.yml"
  schedule:
    # 21:15 IST on weekdays, after the dataset's nightly EOD release.
    - cron: "45 15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: valueforge-daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash-lite
      VALUEFORGE_AI_DAILY_LIMIT: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh EOD universe and run research scan
        run: python -m valueforge.cli refresh-and-scan
      - name: Archive daily market snapshot and scan
        uses: actions/upload-artifact@v4
        with:
          name: valueforge-eod-snapshot-${{ github.run_number }}
          path: |
            data/live/market_latest.csv
            data/live/market_status.json
            data/live/daily_research.csv
            data/live/research_status.json
            data/live/reports/*.md
          if-no-files-found: error
          retention-days: 90
      - name: Commit compact status and agent reports only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/market_status.json data/live/research_status.json
          if [ -d data/live/reports ]; then git add data/live/reports; fi
          if git diff --cached --quiet; then
            echo "No status or report changes."
          else
            git commit -m "chore(data): publish daily EOD research status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
